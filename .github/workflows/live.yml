# The end-to-end check against the real Crossref, arXiv, DataCite, DBLP,
# OpenAlex and doi.org.
#
# Kept out of `ci.yml` on purpose. Pull request CI has to be hermetic, or a
# busy upstream blocks a merge for reasons that have nothing to do with the
# change. Here a failure costs a notification instead, which is the right
# trade for a check that can legitimately fail because someone else's server
# is having a bad day.
#
# Needs a contact address, the same one the CLI asks every user for: set the
# repository secret REFAUDIT_LIVE_EMAIL. Without it the job skips rather than
# fails, so a fork does not see a red tick it cannot fix.
name: live

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays, early, well outside anyone's deadline
  workflow_dispatch:            # and on demand, before cutting a release

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: check against the real services
        env:
          REFAUDIT_LIVE_EMAIL: ${{ secrets.REFAUDIT_LIVE_EMAIL }}
        run: |
          if [ -z "$REFAUDIT_LIVE_EMAIL" ]; then
            echo "REFAUDIT_LIVE_EMAIL is not set; skipping the live check."
            echo "Set it as a repository secret to enable this workflow."
            exit 0
          fi
          pytest tests/test_live.py -v -m live
