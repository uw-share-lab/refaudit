[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/refaudit/_version.py"

[project]
name = "refaudit"
dynamic = ["version"]
description = "Verify bibliography entries against Crossref, DataCite, arXiv and OpenAlex before you submit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bibtex", "citations", "crossref", "openalex", "arxiv", "research-integrity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Typing :: Typed",
]
# No runtime dependencies on purpose: this gets installed in a hurry, close to a
# deadline, often on a machine someone else administers. defusedxml is used if
# present but a hardened stdlib parser is built in.
dependencies = []

[project.optional-dependencies]
xml = ["defusedxml>=0.7"]
dev = ["pytest>=7", "mypy>=1.5", "ruff>=0.4", "pdoc>=14", "types-defusedxml>=0.7"]

[project.scripts]
refaudit = "refaudit.cli:main"

[project.urls]
Homepage = "https://github.com/uw-share-lab/refaudit"
Issues = "https://github.com/uw-share-lab/refaudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/refaudit"]
# Ships the PEP 561 marker so installers of refaudit get its type information
# instead of mypy treating the whole package as untyped.
artifacts = ["src/refaudit/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  # The suite is hermetic so CI cannot be flaked by a busy upstream. The live
  # check is the deliberate exception: it runs only when REFAUDIT_LIVE_EMAIL is
  # set, and on a schedule rather than on pull requests.
  "live: talks to the real APIs; needs REFAUDIT_LIVE_EMAIL",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
